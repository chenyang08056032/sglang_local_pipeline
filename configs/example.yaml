# sglang 本地流水线配置
# 用法: python3 src/run.py --config configs/example.yaml
# 字段默认值见 README 第 3 节; env 默认注入见 run.py 的 _DEFAULT_ENV

run:
  workspace: /root/sglang_local_pipeline
  code:
    repo: /root/.cache/sglang
    git_remote: https://github.com/sgl-project/sglang.git   # prepare=true 时用于 clone/fetch
  prepare: true                           # true=联网: 镜像 pull + 代码 clone/fetch/checkout
                                          # false=离线: 镜像/代码已手动就位, 不联网不动代码
  docker:
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3

nodes:
  - host: 192.168.10.1            # A3
    npus: 16
  - host: 192.168.10.2            # A5

suites:
  - name: test_npu_qwen3_32b
    node: 192.168.10.1
    file: test/registered/npu/llm_models/test_npu_qwen3_32b.py   # 相对 repo; 绝对路径须在容器可见挂载内 (repo 或 ~/.cache)
    timeout_minutes: 120                # docker run 超时 (分钟), 可省略
