# sglang 本地流水线配置模板 (完整字段示例, 实际使用时按环境裁剪)
# 用法: python3 src/run.py --config configs/example.yaml
# 字段默认值见 README 第 3 节; env 默认注入见 run.py 的 _DEFAULT_ENV

run:
  workspace: /root/sglang_local_pipeline   # 节点上的工作目录; sglang 仓固定在 {workspace}/sglang, 结果目录固定在 {workspace}/results, 均不可另配
  prepare: false                            # true=联网: 节点镜像 pull + 执行机代码 clone/fetch/checkout 后复制到各节点 (需配 run.code.git_remote); false=离线: 节点镜像手动就位, 执行机代码仓手动准备, 两种模式均会清理各节点旧仓后从执行机复制
  code:                                     # 仅 prepare: true 时生效; 离线模式可整段省略
    git_remote: https://github.com/sgl-project/sglang.git   # 执行机 clone/fetch 来源 (节点不再做 git 操作); 联网模式必填
    ref: main                               # 目标版本: 分支名 / tag / commit SHA; 联网模式在执行机 checkout, 默认 main
  docker:
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3   # 测试容器镜像
    devices: auto                           # auto=按节点 arch 推导卡数映射 /dev/davinci0..N-1 (a3=16, a5=8) + 管理设备; 或显式列表如 [0,1,2,3]
    net: host                               # 容器网络模式, 默认 host
    shm_size: 16g                           # 容器共享内存大小; 固定附加 --privileged --ipc=host
    extra_mounts:                           # 额外 docker -v 挂载 (追加到 driver/缓存等默认挂载之后), 默认无; 格式同 docker -v
      - "/data/models:/models"              # 普通挂载
      - "/etc/myconf:/etc/myconf:ro"        # 只读挂载
  env:                                      # 注入容器的环境变量, 按 key 合并覆盖内置默认 (见下方 6 项), 可追加新键
    SGLANG_USE_MODELSCOPE: "true"           # 模型走 modelscope (国内加速)
    HF_ENDPOINT: "https://hf-mirror.com"   # HF 镜像地址
    SGLANG_IS_IN_CI: "true"                 # 标记 CI 环境 (用例据此走 CI 分支)
    TORCH_EXTENSIONS_DIR: "/tmp/torch_extensions"   # torch 编译缓存目录 (落在挂载的 /tmp)
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"   # NPU 内存分配策略
    STREAMS_PER_DEVICE: "32"                # 每卡 stream 数
  a5_env:                                   # 仅 a5 节点单机用例容器注入 (多机用例及其他 arch 节点不注入), 覆盖 env 同名键, 默认无
    ASCEND_USE_FIA: "1"                     # A5 灵衢互联 (FIA) 开启
  # 预置到容器 /tmp/ 的数据集 (节点本地绝对路径, 所在目录自动挂载进容器); 默认不预置
  # 单机用例: 该 node 节点需存在; 多机用例: 仅 router (PD 分离) / master (混布 TP) 节点需存在
  # PD/worker 节点缺失不影响 (它们只起 server 不读数据集); 路径不存在时 cp 静默忽略, 回退在线下载
  datasets:
    - /root/.cache/modelscope/hub/datasets/tmp/test.jsonl  # gsm8k
    - /data/datasets/ShareGPT_V3_unfiltered_cleaned_split.jsonl  # 任意本地路径

nodes:
  - host: 192.168.10.1   # A3, 16 卡
    arch: a3              # 节点架构 (a3/a5), 必填: 决定挂卡数量 (a3=16, a5=8); a5 单机用例 --tp-size 自动减半
    user: root            # SSH 用户名, 默认 root
    port: 22              # SSH 端口, 默认 22
  - host: 192.168.10.2   # A3, 16 卡; 下方多机示例的 1p1d decode / 2p2d 第二个 prefill
    arch: a3
    user: root
    port: 22
  - host: 192.168.10.3   # A3, 16 卡; 2p2d 示例的 decode
    arch: a3
    user: root
    port: 22
  - host: 192.168.10.4   # A3, 16 卡; 2p2d 示例的 decode
    arch: a3
    user: root
    port: 22
  - host: 192.168.10.5   # A5, 8 卡; 其上的单机用例 --tp-size 自动减半 (脚本按 A3 卡数配置)
    arch: a5
    user: root
    port: 22

suites:
  # ---- 单机用例: node 指定执行节点 ----
  - name: test_npu_qwen3_32b                       # 用例名称 (--suite 过滤用), 必填
    node: 192.168.10.1                             # 单机用例执行的节点 host (nodes 仅 1 个时可省略); 与 roles/multinode 互斥
    file: test/registered/npu/llm_models/test_npu_qwen3_32b.py   # 用例文件路径, 相对 repo; 绝对路径须在容器可见挂载内 (repo 或 ~/.cache), 必填
    timeout_minutes: 60                            # docker run 超时 (分钟), 含模型下载/加载余量; 不配则不限时

  # ---- 多机 PD 分离用例: roles 配角色节点 (与 node/multinode 互斥) ----
  # prefill/decode 拉起服务, router 等 PD 就绪后执行基准测试; prefill/decode 支持
  # 多节点 (列表), router 只能单个 (sglang 框架限制)。详见 README 第 7 节。
  - name: dsv4-flash-w8a8-1p1d-16p
    roles:                                        # 多机 PD 分离用例: 角色到节点的映射
      prefill: 192.168.10.1                       # 拉起 prefill 服务; 字符串=单节点, 列表=多节点
      decode: 192.168.10.2                        # 拉起 decode 服务; 字符串=单节点, 列表=多节点
      router: 192.168.10.1                        # 等 PD 就绪后拉起 router 并执行测试; 只能配单个节点, 不占 NPU, 通常复用 P/D 节点
    file: test/registered/npu/performance/deepseek_v4_flash/test_npu_deepseek_v4_flash_w8a8_1p1d_16p_in8k_out1k_50ms.py
    timeout_minutes: 120                          # 角色容器超时 (分钟); prefill/decode 实际再加 2 分钟余量

  - name: dsv4-flash-w8a8-2p2d-16p
    roles:
      prefill: [192.168.10.1, 192.168.10.2]       # 列表=多节点 (2p2d)
      decode: [192.168.10.3, 192.168.10.4]
      router: 192.168.10.1
    file: test/registered/npu/performance/deepseek_v4_flash/test_npu_deepseek_v4_flash_w8a8_2p2d_16p.py
    timeout_minutes: 120

  # ---- 多机混布 TP 用例: multinode 配节点列表 (与 node/roles 互斥) ----
  # 多节点组成一个 sglang server 实例 (TP 跨节点), 第一个节点 = master (跑测试),
  # 其余 = worker (只起 server)。详见 README 第 8 节。
  - name: glm5_2-16p-gpqa
    multinode: [192.168.10.1, 192.168.10.2]       # 节点 host 列表 (≥2 个, 第一个 = master, 其余 = worker); 无 router 角色
    file: test/registered/npu/accuracy/glm5_2/test_npu_glm_5_2_w8a8_16p_gpqa.py
    timeout_minutes: 120                          # 节点容器超时 (分钟); worker 实际再加 2 分钟余量
