# 多机 PD 分离模板（用法见 README 快速上手，判定见 2.3）

run:
  workspace: /root/sglang_local_pipeline   # [必填] 节点上的工作目录

  docker:
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3   # [必填] 测试镜像

    # extra_mounts:                     # 权重不在节点 ~/.cache 时挂载（prefill/decode 节点都要有）
    #   - "/data/weights:/root/.cache/modelscope/hub/models"

  # datasets:                           # 预置数据集，自动软链到 /tmp（只需 router 节点有）
  #   - /data/datasets/ShareGPT_V3_unfiltered_cleaned_split.json
  #   - /data/datasets/test.jsonl


nodes:
  - host: 192.168.10.1
    arch: a3
  - host: 192.168.10.2
    arch: a3
  - host: 192.168.10.3
    arch: a3
  - host: 192.168.10.4
    arch: a3


suites:
  - roles:                              # [必填] 三个角色各配节点
      prefill: 192.168.10.1
      decode: 192.168.10.3
      router: 192.168.10.1
    file: test/registered/npu/performance/deepseek_v4_flash/test_npu_deepseek_v4_flash_w8a8_1p1d_16p_in8k_out1k_50ms.py   # [必填]
    timeout_minutes: 240                # PD 用例建议给足（默认 60）

  - roles:                              # 4 机 2P2D：角色配成节点列表
      prefill: [192.168.10.1, 192.168.10.2]
      decode: [192.168.10.3, 192.168.10.4]
      router: 192.168.10.1
    file: test/registered/npu/performance/deepseek_v4_flash/test_npu_deepseek_v4_flash_w8a8_2p2d_16p.py
    timeout_minutes: 240
