# 单机用例模板（用法见 README 快速上手，精度用例见 1.4）

run:
  workspace: /root/sglang_local_pipeline   # [必填] 节点上的工作目录

  docker:
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3   # [必填] 测试镜像

    # extra_mounts:                     # 权重不在节点 ~/.cache 时，把实际目录挂到容器读取路径
    #   - "/data/weights:/root/.cache/modelscope/hub/models"

  # datasets:                           # 预置数据集，自动软链到 /tmp
  #   - /data/datasets/ShareGPT_V3_unfiltered_cleaned_split.json
  #   - /data/datasets/test.jsonl


nodes:
  - host: 192.168.10.1                  # [必填] 节点 IP
    arch: a3


suites:
  - file: test/registered/npu/llm_models/test_npu_qwen3_32b.py   # [必填] 用例路径（相对 sglang 仓）
  - file: test/registered/npu/llm_models/test_npu_qwen3_30b.py
  - file: test/registered/npu/basic_function/runtime_options/test_npu_random_seed.py
