# 多机混布 TP 用例模板: 多节点组成一个 sglang server 实例 (TP 跨节点), 无 PD/router 角色 (multinode 配节点列表)
# 用法: python3 src/run.py --config configs/example_tp.yaml --dry-run
# 前置: 节点间互通, 且各节点可达执行机 9377 协调端口 (见 README 8.3)
# run 段其余可选字段 (code/env 等) 见 example_single.yaml; evalscope 仅精度用例需要, 自动准备

run:
  workspace: /root/sglang_local_pipeline   # [必填] 节点工作目录 (sglang 仓固定 {workspace}/sglang)
  docker:
    image: swr.cn-south-west-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3   # [必填] 测试容器镜像
  # extra_mounts:                          # 额外 docker -v 挂载; 所有节点均需预置模型缓存或挂载
  #   - "/data/weights/your_model:/root/.cache/modelscope/hub/models/Eco-Tech/your_model"
  # datasets:                              # 预置数据集; 仅 master (列表第一个) 节点需要
  #   - /root/.cache/modelscope/hub/datasets/tmp/test.jsonl

nodes:
  - host: 192.168.10.1   # [必填] master (A3, 16 卡)
    arch: a3             # [必填] a3=16 卡 / a5=8 卡
  - host: 192.168.10.2   # [必填] worker (A3, 16 卡)
    arch: a3

suites:
  # 混布 TP 用例: multinode 配节点列表 (与 node/roles 互斥)
  # 第一个 = master (起 server + 跑测试), 其余 = worker (只起 server)
  # name 可省略: 默认取 file basename → test_npu_glm_5_2_w8a8_16p_gpqa
  - multinode: [192.168.10.1, 192.168.10.2]   # [必填] 节点列表 (≥2 个)
    file: test/registered/npu/accuracy/glm5_2/test_npu_glm_5_2_w8a8_16p_gpqa.py   # [必填] 用例路径, 相对 repo
    timeout_minutes: 120    # 节点容器超时 (分钟), 默认 60
