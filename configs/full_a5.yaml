# A5 全量流水线: 3 节点均分 175 个单机用例并行执行
# 用法: python3 src/run.py --config configs/full_a5.yaml
run:
  workspace: /mnt/share/dzc/sglang
  docker:
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-950-B072
    extra_mounts:
      - "/mnt/share:/mnt/share"
      - "/mnt/share/dzc/hub:/mnt/share/dzc/hub"
      - "/mnt/share/dzc/data/modelscope:/root/.cache/modelscope"
      - "/mnt/share/dzc/data/huggingface:/root/.cache/huggingface"
      - "/mnt/share/dzc/data/sgl_eval:/root/.cache/sgl_eval"
      - "/mnt/share/dzc/data/sglang:/root/.cache/sglang"
      - "/etc/hccl_rootinfo.json:/etc/hccl_rootinfo.json"
  a5_env:
    ASCEND_USE_FIA: "1"
  datasets:
    - /mnt/share/dzc/data/modelscope/hub/datasets/test.jsonl
    - /mnt/share/dzc/data/modelscope/hub/datasets/ShareGPT_V3_unfiltered_cleaned_split.json
  env:
    http_proxy: "http://141.3.245.240:30066"
    https_proxy: "http://141.3.245.240:30066"
    GIT_SSL_NO_VERIFY: "true"
    PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
    PIP_RETRIES: "5"
    PIP_TIMEOUT: "120"
  init_timeout_minutes: 120
nodes:
  - host: 141.61.45.113
    arch: a5
  - host: 141.61.45.118
    arch: a5
  - host: 141.61.45.119
    arch: a5
